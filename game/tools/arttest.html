<!doctype html><html><body style="margin:0;background:#000">
<canvas id="c" width="320" height="200" style="width:1280px;height:800px;image-rendering:pixelated"></canvas>
<script type="module">
import { createFrame, composite, painterFor, hex } from "../src/px.js";
import { drawSpirit } from "../src/game/spirit_art.js";
import { Hero } from "../src/game/hero.js";
import { heroStats } from "../src/data/spirits.js";
const f = createFrame(320, 200), p = painterFor(f);
const ids = ["sala", "undi", "sylphi", "nomi"];
ids.forEach((id, i) => [1, 2, 3].forEach((st, j) => drawSpirit(p, 30 + j * 40, 24 + i * 46, { id, stage: st, t: 1.3 })));
["agni", "levia", "tempest", "gaia"].forEach((id, i) => drawSpirit(p, 150, 24 + i * 46, { id, stage: 3, t: 0.7 }));
// heroes per stage
const fakeW = { fx: () => null, clampToArena() {} };
ids.forEach((id, i) => [1, 2, 3].forEach((st, j) => { const h = new Hero({ spirit: { id, lv: 1, stage: st }, stats: heroStats({ id, lv: 1, stage: st }), x: 190 + j * 42, y: 40 + i * 46 }); h.world = fakeW; h.t = 0.5; p.reset(); h.draw(p); }));
const ctx = document.getElementById("c").getContext("2d"), img = ctx.createImageData(320, 200);
composite(f, img.data, hex("#1c1926")); ctx.putImageData(img, 0, 0);
</script></body></html>
